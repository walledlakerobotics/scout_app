<!doctype html>

<head>
  <link rel="stylesheet" type="text/css" href="/CSS/global.css" />
  <link rel="stylesheet" type="text/css" href="/CSS/Index-login.css" />
  <link rel="stylesheet" type="text/css" href="/CSS/admin/admin.css" />
  <link rel="stylesheet" type="text/css" href="/CSS/admin/events.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
  <div class="main">
    <div class="text-container">
      <h1 class="tc-formatted" id="header">Events</h1>
      <div class="events" id="events">
        <div class="events-list themed-frosted" id="events-offseason">
          <h4 class="list-header">FIRST</h4>
        </div>
        <div class="events-list themed-frosted" id="events-first">
          <h4 class="list-header">OCCRA</h4>
          <button class="mainBtn">
            <ion-icon name="checkmark-circle"></ion-icon>
            UNTITLED EVENT 1
          </button>
        </div>
      </div>
      <div class="main-buttons">
        <button class="mainBtn" id="new-event-btn">
          <ion-icon name="add-circle"></ion-icon>
          New Offseason (OCCRA) Event
        </button>
        <div class="form" id="form" style="display: none;">
          <div>
            <h4>EVENT PUBLIC NAME</h4>
            <input type="text" id="event-name" placeholder="Formatted like: '2026 OCCRA Oxford Event'" maxlength="35" />
          </div>
          <div style="display: flex; gap: 10px; justify-content: center;">
            <div style="max-width: 50%;">
              <h4>START DATE</h4>
              <input type="date" id="event-start-date" style="width: 245px;" />
            </div>
            <div style="max-width: 50%;">
              <h4>END DATE</h4>
              <input type="date" id="event-end-date" style="width: 245px;" />
            </div>
          </div>
          <div>
            <h4>EVENT LOCATION</h4>
            <input type="text" id="event-location" placeholder="i.e: 'Oxford Highschool'" maxlength="35" />
          </div>
          <div style="display: flex; flex-direction: row;">
            <div class="readout" style="align-items: flex-start;">
              <h4 class="noneditable">SHORT NAME:</h4>
              <h4 id="ro-name">Oxford</h4>
            </div>
            <div class="vr"></div>
            <div class="readout" style="align-items: center;">
              <h4 class="noneditable">EVENT KEY:</h4>
              <h4 id="ro-key">2026wlros-oxf</h4>
            </div>
            <div class="vr"></div>
            <div class="readout" style="align-items: flex-end;">
              <h4 class="noneditable">DURATION</h4>
              <h4 id="ro-duration">5 days</h4>
            </div>
          </div>
          <div>
            <h4 class="noneditable" style="text-align: center;">Please confirm that all values appear correct.</h4>
          </div>
          <div style="display: flex; flex-direction: row; gap: 10px;">
            <button class="mainBtn" id="cancel-creation-btn" style="width: 245px;">
              <ion-icon name="arrow-undo"></ion-icon>
              Nevermind
            </button>
            <button class="mainBtn" id="create-btn" style="width: 245px;">
              <ion-icon name="caret-forward"></ion-icon>
              Create Event
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div class="footer">
        <button class="mini-btn" onclick="location.href = `/HTML/index.html`">
          <ion-icon name="arrow-back-circle-outline"></ion-icon>
        </button>
        <a href="https://github.com/walledlakerobotics/walledlakerobotics.github.io">
          <button class="mini-btn">
            <ion-icon name="logo-github"></ion-icon>
          </button>
        </a>
        <button class="mini-btn" onclick="toggleTheme()">
          <ion-icon name="sunny"></ion-icon>
        </button>
        <button class="mini-btn" style="border-color: #3f51b5" onclick="window.open('https://www.thebluealliance.com')">
          <img class="ionicon blue" src="https://www.thebluealliance.com/images/tba_lamp.svg" />
        </button>
        <button class="mini-btn" style="border: 1px solid rgb(255, 0, 0); background-color: #ff000013"
          onclick="logout()">
          <ion-icon name="log-out-outline" style="color: rgb(255, 0, 0)"></ion-icon>
        </button>
      </div>
      <p class="tc-formatted">© 2026 Walled Lake Robotics</p>
    </footer>
  </div>
  <script type="module" src="/JS/admin/manage-events.js"></script>
  <script type="module" src="/JS/utils.js"></script>
  <script src="/JS/theme.js"></script>
  <script src="/JS/check-auth.js"></script>
</body>
